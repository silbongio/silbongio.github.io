---
layout: default
---

<div class="row g-5 mb-5">
  <div class="col-md-6">
    {{ content }}
  </div>
  <div class="col-md-6">
    <a href="https://www.magalipolverino.com/">
      <img src="{{ site.github.url }}/assets/img/E9WgDCiVgAErUgR.jpeg" alt="Home" width="80%">
    </a>
  </div>
</div>

{% include publications.html %}

<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h5 class="fw-bold border-bottom pb-3 mb-5">Updates</h5>
    {% for post in site.posts %}
      <p><a href="{{ site.github.url }}/{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %-d, %Y" }}</p>
    {% endfor %}
  </div>
</div>
